name: Alpicut Android Lab

on:
  push:
    branches: [droid-lab]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  droid:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Araçlar
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg unzip > /dev/null
      - name: Paketler
        run: npm install --no-audit --no-fund
      - name: Varlıklar
        run: node scripts/fetch-assets.mjs
      - name: Test medyası
        timeout-minutes: 10
        run: bash lab/make-media.sh
      - name: APK
        run: |
          npx cap add android
          node scripts/android-setup.mjs
          npx cap sync android
          mkdir -p ~/.android && cp android-keystore/debug.keystore ~/.android/debug.keystore
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon -q
          cp app/build/outputs/apk/debug/app-debug.apk ../Alpicut.apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emülatörde test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash lab/droid.sh
      - name: Sonuçlar
        if: always()
        run: |
          mkdir -p /tmp/res && cp -r lab/out/* /tmp/res/ 2>/dev/null; cd /tmp/res
          git init -q && git checkout -q -b droid-results && git config user.name ci && git config user.email ci@alpicut.local
          git add -A && git commit -qm "droid $GITHUB_RUN_NUMBER" && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" droid-results || true
