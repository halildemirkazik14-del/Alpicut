name: Alpicut Lab

on:
  push:
    branches: [lab-run]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Keşif
        run: node lab/discover.mjs || true
      - name: Paketler
        run: bash lab/packages.sh || true
      - name: Ek testler
        run: if [ -f lab/run.sh ]; then bash lab/run.sh || true; fi
      - name: Sonuçları yayınla
        run: |
          cd lab/out
          git init -q && git checkout -q -b lab-results
          git config user.name "alpicut-lab" && git config user.email "lab@alpicut.local"
          git add -A && git commit -qm "lab $GITHUB_RUN_NUMBER"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" lab-results
