name: Alpicut APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest içinde Android SDK hazır geliyor
      - name: Android SDK lisansları
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Paketleri kur
        run: npm install --no-audit --no-fund

      - name: Barlow fontlarını kopyala
        run: node scripts/copy-fonts.mjs

      - name: Android projesini oluştur
        run: npx cap add android

      - name: Alpicut ayarlarını uygula
        run: node scripts/android-setup.mjs

      - name: Uygulama simgesi ve açılış ekranı
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#7C3AED' --iconBackgroundColorDark '#7C3AED' --splashBackgroundColor '#0E0A17' --splashBackgroundColorDark '#0E0A17'

      - name: Senkronize et
        run: npx cap sync android

      - name: Sabit imza anahtarı (güncellemeler üstüne kurulabilsin)
        run: |
          mkdir -p ~/.android
          cp android-keystore/debug.keystore ~/.android/debug.keystore

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK'yı adlandır
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Alpicut.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Alpicut-APK
          path: Alpicut.apk

      - name: Sürüm yayınla (telefondan indirmek için)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Alpicut v1.0.${{ github.run_number }}
          body: Telefonundan **Alpicut.apk** dosyasına dokunup indir ve kur.
          files: Alpicut.apk
