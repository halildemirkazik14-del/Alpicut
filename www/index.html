<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0E0A17">
  <title>Alpicut</title>
  <!-- Paketli fontlar (derlemede oluşturulur) -->
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Ana ekran -->
  <section id="home" class="screen">
    <header class="home-head">
      <div class="brand"><span class="brand-logo" id="brandLogo"></span><span class="brand-name">Alpi<b>cut</b></span></div>
    </header>
    <button id="newProject" class="new-project">
      <span class="np-plus"></span>
      <span class="np-text"><b>Yeni Proje</b><small>Video, fotoğraf ve ses ekleyerek başla</small></span>
    </button>
    <div class="ratio-pick" id="ratioPick"></div>
    <button class="btn block ghost" id="importPkg"></button>
    <h2 class="section-title">Projelerim</h2>
    <div id="projectList" class="project-list"></div>
  </section>

  <!-- Editör -->
  <section id="editor" class="screen hidden">
    <header class="topbar">
      <button class="icon-btn" id="btnBack" aria-label="Geri"></button>
      <input id="projName" class="proj-name" spellcheck="false">
      <button class="icon-btn" id="btnUndo" aria-label="Geri al"></button>
      <button class="icon-btn" id="btnRedo" aria-label="Yinele"></button>
      <button class="export-btn" id="btnExport">Dışa Aktar</button>
    </header>
    <section class="preview-wrap" id="previewWrap">
      <div class="stage" id="stage"><canvas id="preview"></canvas></div>
      <button class="view-reset hidden" id="viewReset">100% · Sığdır</button>
      <div class="empty-hint" id="emptyHint">Başlamak için alttan <b>Medya</b> ekle</div>
    </section>
    <div class="transport">
      <span class="tc" id="timeCode">00:00.0 / 00:00.0</span>
      <div class="tr-mid">
        <button class="icon-btn sm" id="btnFirst" aria-label="Başa dön"></button>
        <button class="icon-btn sm" id="btnPrevF" aria-label="Önceki kare"></button>
        <button class="play-btn" id="btnPlay" aria-label="Oynat"></button>
        <button class="icon-btn sm" id="btnNextF" aria-label="Sonraki kare"></button>
      </div>
      <div class="tr-right">
        <button class="icon-btn sm" id="btnZoomOut" aria-label="Uzaklaş"></button>
        <button class="icon-btn sm" id="btnZoomIn" aria-label="Yakınlaş"></button>
      </div>
    </div>
    <section class="timeline" id="timeline">
      <div class="tl-scroll" id="tlScroll"><div class="tl-inner" id="tlInner"></div></div>
      <div class="playhead"></div>
    </section>
    <nav class="toolbar" id="toolbar"></nav>
  </section>

  <!-- Alt panel -->
  <div class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-head">
      <h3 id="sheetTitle"></h3>
      <div class="sheet-actions" id="sheetActions"></div>
      <button class="icon-btn ok" id="sheetClose" aria-label="Tamam"></button>
    </div>
    <div class="sheet-tabs" id="sheetTabs"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <!-- Dışa aktarma -->
  <div class="modal hidden" id="exportModal">
    <div class="modal-card" id="exportCard"></div>
  </div>

  <div class="toast" id="toast"></div>
  <input type="file" id="fileInput" hidden>
  <script type="module" src="js/main.js"></script>
</body>
</html>
